on 2).</div><hr class='cover-divider'><div class='cover-section'><h3>Bon à savoir avant de commencer</h3><div class='cover-cards'><div class='cover-card'><span class='ic'>⏱️</span><h4>Durée</h4><p>Variable selon la complexité de vos données. Vous pouvez sauvegarder votre progression à tout moment et la reprendre plus tard.</p></div><div class='cover-card'><span class='ic'>🤝</span><h4>Modalité recommandée</h4><p>À remplir avec l'assistance d'une personne de référence, chargée de guider les répondants dans la compréhension des concepts et la complétion des questions.</p></div><div class='cover-card'><span class='ic'>🔒</span><h4>Confidentialité</h4><p>Toutes vos réponses seront traitées de façon strictement confidentielle.</p></div></div></div><div class='cover-section'><h3><span class='ic'>🎁</span> Ce que vous obtiendrez</h3><div class='cover-highlight'><p>À la fin du questionnaire, vous pourrez télécharger le diagnostic complet de votre jeu de données et consulter une visualisation interactive de ses résultats. Il ne s'agit pas d'un score de qualité, mais d'un diagnostic brut, directement exploitable pour vos décisions de curation et de modélisation.</p><div class='cover-highlight-grid'><div class='cover-card'><span class='ic'>📄</span><h4>4 fichiers CSV</h4><p>Entités, attributs, groupes d'attributs et vue d'ensemble de la structure de votre jeu de données.</p></div><div class='cover-card'><span class='ic'>📊</span><h4>Visualisation interactive</h4><p>Identifiez en un coup d'œil les points forts et les lacunes de votre curation, et évaluez quelles données sont prêtes à être publiées.</p></div></div></div></div><p class='cover-contact'>Une question, une précision ? Écrivez-nous à <a href='mailto:cristobal.barria@geneve.ch'>cristobal.barria@geneve.ch</a></p><div class='cover-cta-wrap'><button onclick='survey.nextPage()' class='cover-cta'>Commençons ! →</button></div></div>"

                    "html": "<h2 class='q-title'>4. Entités</h2>"
                },
                {
                    "type": "html",
                    "name": "cover",
                    "html": "<h3 class='q-subtitle'>4.1 – Entités / Tables</h3>\n<p class='q-text'>Cette question vise à recenser les entités présentes dans votre jeu de données.</p>\n<p class='q-text'>Par « entité », nous entendons tout concept, objet, événement ou élément individuel pour lequel des propriétés ou attributs sont stockés. Pensez aux principales catégories qui composent votre jeu de données.</p>\n<ul class='q-list'>\n  <li>Exemples d'entités courantes dans les institutions GLAM : <em>Œuvres</em>, <em>Auteurs</em>, <em>Expositions</em>, <em>Collections</em>, <em>Documents</em>, <em>Volumes</em>, <em>Thèmes</em>, <em>Événements historiques</em>, etc.</li>\n</ul>\n<p class='q-text'>Dans le cas d'une base de données relationnelle, nous faisons référence aux tables qui composent la base de données, telles que <em>Œuvres</em>, <em>Auteurs</em>, <em>Expositions</em>, <em>Documents</em>, etc.</p>\n<p class='q-text'>Veuillez répondre à cette question en vous concentrant sur les entités de votre jeu de données, et non sur les attributs qui les décrivent.</p>"
                },
                {
                    "type": "matrixdynamic",
                    "name": "question1g4",
                    "titleLocation": "hidden",

                    "type": "html",
                    "name": "cover",
                    "html": "<h3 class='q-subtitle'>5.1 – Attributs / Champs</h3>\n<p class='q-text'>Pour chaque entité que vous avez indiquée dans la question 4.1, détaillez tous les attributs (champs) enregistrés.</p>\n<p class='q-text'>Par « attribut », nous entendons toute information ou propriété qui décrit une entité dans le jeu de données. Par exemple : dans l'entité « Œuvres », les attributs peuvent être « titre », « auteur », « date de création », « matériau », etc.</p>\n"

                    "html": "<h3 class='q-subtitle'>7.1 – Expression des incertitudes dans les attributs</h3><p class='q-text'>Cette question vise à clarifier les différents modes d'expression des incertitudes dans les attributs décrits dans la question 5.1.</p><p class='q-text'>Sont considérées comme exprimant une incertitude toutes les expressions indiquant que la valeur est douteuse, inconnue, incertaine, approximative, alternative ou non définie.</p><p class='q-text'>Si plusieurs formats d'expression coexistent pour un même attribut, ajoutez une ligne par format.</p>"

                },
                {
                    "type": "html",
                    "name": "intro_g8_1",
                    "html": "<h3 class='q-subtitle'>8.1 – Ambiguïtés dans les valeurs d'attributs à multiples entrées (cardinalité multiple)</h3><p class='q-text'>Cette question vise à identifier et caractériser les relations sémantiques entre les valeurs multiples d'un même attribut, lorsque celui-ci peut contenir plusieurs valeurs dans un même enregistrement (cardinalité supérieure à 1).</p><p class='q-text'>Par « ambiguïté », on entend toute situation où la relation entre les valeurs d'une même cellule n'est pas explicitement définie, peut être interprétée de plusieurs manières, ou présente des sens différents selon le contexte.</p><p class='q-text'>Exemple : un attribut « Technique » contenant « Peinture à l'huile, Collage » — s'agit-il de deux techniques employées simultanément ? L'une corrige-t-elle l'autre ? Sont-elles en relation hiérarchique ?</p><p class='q-text'>Si plusieurs relations sémantiques coexistent pour les valeurs d'un même attribut, ne retenez que la relation sémantique correcte selon les règles de votre institution et indiquez le nombre de valeurs qui correspondent à cette relation. Les autres valeurs seront considérées comme des expressions non curées.</p>"
                },
                {
                    "type": "matrixdynamic",
                    "name": "question1g8",
                    "titleLocation": "hidden",
                    "rowCount": 2,
                    "addRowText": "Ajouter une ligne",

                    ]
                },
                {
                    "type": "html",
                    "name": "intro_g8_2",
                    "html": "<h3 class='q-subtitle'>8.2 – Ambiguïtés entre enregistrements d'un même attribut</h3><p class='q-text'>Cette question vise à identifier les hétérogénéités sémantiques au sein d'un même attribut, c'est-à-dire des enregistrements dont les valeurs ne partagent pas la même signification sémantique.</p><p class='q-text'>Ne sélectionnez pas ici des valeurs dont la relation se limite à être une variante d'expression, ni celles résultant d'erreurs de saisie.</p><p class='q-text'>Si plusieurs cas d'hétérogénéité coexistent pour un même attribut, ajoutez une ligne par cas.</p>"

                    "name": "intro_g8_3",
                    "visibleIf": "{hasGroupe} = true",
                    "html": "<h3 class='q-subtitle'>8.3 – Ambiguïtés entre attributs au sein d'un même groupe</h3><p class='q-text'>Cette question vise à identifier les cas où les attributs d'un même groupe entretiennent des relations sémantiques ambiguës ou hétérogènes. Si un groupe est bien défini, ses attributs devraient toujours être liés par un même type de relation. Cette question permet de repérer les groupes où ce n'est pas le cas.</p><p class='q-text'>Si plusieurs relations sémantiques existent pour les attributs d'un même groupe, ne retenez que la relation sémantique correcte et indiquez le nombre de valeurs qui correspondent à cette relation. Les autres valeurs seront considérées comme des expressions non curées.</p>"

            "elements": [
                {
                    "type": "html",
                    "name": "recap_nc_rules",
                    "html": "<details style='margin-top:32px;border:1px solid #ddd;border-radius:6px;padding:0;font-family:Arial,sans-serif;font-size:13px;'><summary style='padding:12px 16px;cursor:pointer;font-weight:bold;color:#2c3e50;background:#f4f4f4;border-radius:6px;'>ℹ Comment est calculé le % NC (données non curées) ?</summary><div style='padding:16px;'><p style='margin:0 0 8px;color:#333;font-weight:bold;'>Un attribut contribue au % NC dans les cas suivants :</p><ul style='margin:0 0 16px;padding-left:20px;color:#555;line-height:1.8;'><li><strong>Question 7.1</strong> — l'attribut est associé à une expression d'incertitude de type <em>Texte libre</em></li><li><strong>Question 8.1</strong> — l'attribut présente des ambiguïtés dans ses valeurs multiples (cardinalité)</li><li><strong>Question 8.2</strong> — l'attribut présente des hétérogénéités sémantiques entre enregistrements</li><li><strong>Question 8.3</strong> — les attributs de son groupe présentent des relations ambiguës</li><li><strong>Question 9.1</strong> — ses valeurs de date ne sont pas toutes normalisées dans un format unique</li><li><strong>Question 9.2</strong> — son identifiant n'est pas unique (Unicité = Non)</li><li><strong>Question 9.3</strong> — plusieurs types d'identifiants externes coexistent pour le même attribut</li><li><strong>Question 9.4</strong> — plusieurs types de liens vers des ressources coexistent pour le même attribut</li><li><strong>Question 9.5</strong> — ses liens vers d'autres entités ne couvrent pas tous les enregistrements</li><li><strong>Question 9.7</strong> — ses valeurs ne sont pas toutes normalisées selon un vocabulaire contrôlé</li></ul><hr style='border:none;border-top:1px solid #eee;margin:12px 0;'/><p style='margin:0 0 8px;color:#333;font-weight:bold;'>Comment est calculé le % NC affiché ?</p><p style='margin:0 0 8px;color:#555;'>Un même attribut peut avoir des problèmes dans plusieurs questions à la fois. Par exemple : 45 % de ses enregistrements ont une ambiguïté (8.1) et 30 % ont des dates non normalisées (9.1). Comme on ne sait pas si ce sont les mêmes enregistrements, additionner les deux risquerait de compter certains deux fois.</p><p style='margin:0;color:#555;'>Pour éviter cela, le % NC affiché correspond à <strong>la dimension la plus problématique</strong> — ici 45 %. Cela garantit que le chiffre affiché est toujours <strong>une estimation prudente par le bas</strong> : au moins ce pourcentage de données est non curé, peut-être davantage.</p></div></details>"

// Actualiza las opciones de la columna 'modele' según los modelos seleccionados en question2g3
function updateQuestion1g4(survey) {
    var question2g3 = survey.getQuestionByName("question2g3");
    var question1g4 = survey.getQuestionByName("question1g4");
    if (!question2g3 || !question1g4) return;

    var selectedSystems = question2g3.value || [];

    var modeleColumn = question1g4.columns.find(c => c.name === "modele");
    if (!modeleColumn) return;

    modeleColumn.choices = selectedSystems;

    question1g4.data.forEach(function(row) {
        if (!selectedSystems.includes(row.modele)) {
            row.modele = "";
        }
    });
}

// Actualiza las opciones de la columna 'systeme' según los sistemas seleccionados en question1g3
function updateQuestion1g4Systeme(survey) {
    var question1g3 = survey.getQuestionByName("question1g3");
    var question1g4 = survey.getQuestionByName("question1g4");
    if (!question1g3 || !question1g4) return;

    var selected = question1g3.value || [];
    var selectedSystems = Array.isArray(selected)
        ? selected.filter(function(v) { return v !== "other"; })
        : [];

    var systemeColumn = question1g4.columns.find(function(c) { return c.name === "systeme"; });
    if (!systemeColumn) return;

    systemeColumn.choices = selectedSystems;

    if (question1g4.data) {
        question1g4.data.forEach(function(row) {
            if (row.systeme && selectedSystems.indexOf(row.systeme) === -1) {
                row.systeme = "";
            }
        });
    }
}

function updateQuestion1g5(survey) {
    var question1g4 = survey.getQuestionByName("question1g4");
    var question1g5 = survey.getQuestionByName("question1g5");

    if (!question1g4 || !question1g5) return;

    // Tomamos los valores de 'entite' de las filas visibles
    var entites = question1g4.visibleRows.map(row => row.value.entite).filter(v => v);

    // Actualizamos la columna 'Entites'
    var entitesColumn = question1g5.columns.find(c => c.name === "Entites");

// Helpers génériques pour mise à jour dynamique des dropdowns
function getAttrsByType(survey, filterType) {
    var q5 = survey.getQuestionByName("question1g5");
    if (!q5) return [];
    var rows = q5.value || [];
    if (filterType) {
        return rows.filter(function(r) { return r.TypeDonnee === filterType; })
                   .map(function(r) { return r.Attributs; }).filter(function(v) { return v; });
    }
    return rows.map(function(r) { return r.Attributs; }).filter(function(v) { return v; });
}

function getAttrsByGroupe(survey, groupe) {
    if (!groupe) return [];
    var q5 = survey.getQuestionByName("question1g5");
    if (!q5 || !q5.value) return [];
    return q5.value
        .filter(function(r) { return r.Grupo === groupe; })
        .map(function(r) { return r.Attributs; })
        .filter(function(v) { return v; });
}

function updateColumnChoices(survey, questionName, columnName, choices) {
    var q = survey.getQuestionByName(questionName);
    if (!q) return;
    var col = q.columns.find(function(c) { return c.name === columnName; });
    if (!col) return;
    col.choices = choices;
}

// Accède à la question d'une cellule spécifique dans une ligne de matrice
function getCellQuestion(row, matrixQ, colName) {
    if (row.getQuestionByColumnName) {
        var q = row.getQuestionByColumnName(colName);
        if (q) return q;
    }
    if (row.cells) {
        for (var i = 0; i < matrixQ.columns.length; i++) {
            if (matrixQ.columns[i].name === colName) {
                var cell = row.cells[i];
                return (cell && cell.question) ? cell.question : cell;
            }
        }
    }
    return null;
}

// Attributs filtrés par entité + type (null = tous types)
function getAttrsByEntiteAndType(survey, entite, filterType) {
    var q5 = survey.getQuestionByName("question1g5");
    if (!q5 || !q5.value) return [];
    return q5.value.filter(function(r) {
        var matchEntity = !entite || r.Entites === entite;
        var matchType   = !filterType || r.TypeDonnee === filterType;
        return matchEntity && matchType && r.Attributs;
    }).map(function(r) { return r.Attributs; }).filter(function(v) { return v; });
}

// Attributs filtrés par entité + groupe (pour 8.3)
function getAttrsByGroupeAndEntite(survey, groupe, entite) {
    if (!groupe) return [];
    var q5 = survey.getQuestionByName("question1g5");
    if (!q5 || !q5.value) return [];
    return q5.value.filter(function(r) {
        return r.Grupo === groupe && (!entite || r.Entites === entite) && r.Attributs;
    }).map(function(r) { return r.Attributs; }).filter(function(v) { return v; });
}

// Mise à jour des entités pour les questions 6.1 (doublons) et 7.1 (incertitudes)
function updateEntiteDropdowns(survey) {
    var q4 = survey.getQuestionByName("question1g4");

// Handler générique — Entite → Attribut/Attribut1 pour sections 8–12
var attrChoicesByQuestion = {};

survey.onMatrixCellValueChanged.add(function(sender, options) {
    var config = entityAttrConfig[options.question.name];
    if (!config || options.columnName !== "Entite") return;

    var selectedEntite = options.value;
    var q5 = sender.getQuestionByName("question1g5");
    var attrs = [];
    if (q5 && q5.value) {
        attrs = q5.value.filter(function(r) {
            var matchEntity = !selectedEntite || r.Entites === selectedEntite;
            var matchType = config.typeFilters
                ? config.typeFilters.indexOf(r.TypeDonnee) !== -1
                : (!config.typeFilter || r.TypeDonnee === config.typeFilter);
            return matchEntity && matchType && r.Attributs;
        }).map(function(r) { return r.Attributs; }).filter(function(v) { return v; });
    }

    var qName = options.question.name;
    var rowIndex = options.row.rowIndex;
    if (!attrChoicesByQuestion[qName]) attrChoicesByQuestion[qName] = {};
    attrChoicesByQuestion[qName][rowIndex] = attrs;

    var attrQ = getCellQuestion(options.row, options.question, config.attrCol);
    if (attrQ) {
        attrQ.choices = attrs;
        if (attrQ.clearValue) attrQ.clearValue(); else attrQ.value = undefined;
    }
});

// Handler pour question3g8 — filtrage Attribut1/Attribut2 par Entite et Groupe
survey.onMatrixCellValueChanged.add(function(sender, options) {
    if (options.question.name !== "question3g8") return;

    var q8_3 = options.question;
    var row = options.row;
    var rowData = q8_3.value ? q8_3.value[row.rowIndex - 1] : null;

    if (options.columnName === "Entite") {
        var selectedEntite = options.value;
        var q5 = sender.getQuestionByName("question1g5");
        var groupes = [];
        if (q5 && q5.value) {
            var rawGroupes = q5.value
                .filter(function(r) { return (!selectedEntite || r.Entites === selectedEntite) && r.Grupo; })
                .map(function(r) { return r.Grupo; });
            groupes = rawGroupes.filter(function(v, i) { return rawGroupes.indexOf(v) === i; });
        }
        var groupeQ = getCellQuestion(row, q8_3, "Groupe");
        if (groupeQ) {
            groupeQ.choices = groupes;
            if (groupeQ.clearValue) groupeQ.clearValue(); else groupeQ.value = undefined;
        }
        var attr1Q = getCellQuestion(row, q8_3, "Attribut1");
        var attr2Q = getCellQuestion(row, q8_3, "Attribut2");
        if (attr1Q) { attr1Q.choices = []; if (attr1Q.clearValue) attr1Q.clearValue(); else attr1Q.value = undefined; }
        if (attr2Q) { attr2Q.choices = []; if (attr2Q.clearValue) attr2Q.clearValue(); else attr2Q.value = undefined; }
    }

    if (options.columnName === "Groupe") {
        var currentEntite = rowData ? rowData.Entite : null;
        var groupeAttrs = getAttrsByGroupeAndEntite(sender, options.value, currentEntite);
        var attr1Q = getCellQuestion(row, q8_3, "Attribut1");
        var attr2Q = getCellQuestion(row, q8_3, "Attribut2");
        if (attr1Q) {
            attr1Q.choices = groupeAttrs;
            if (attr1Q.clearValue) attr1Q.clearValue(); else attr1Q.value = undefined;
        }
        if (attr2Q) {
            attr2Q.choices = groupeAttrs;
            if (attr2Q.clearValue) attr2Q.clearValue(); else attr2Q.value = undefined;
        }
    }

    if (options.columnName === "Attribut1") {
        var currentEntite = rowData ? rowData.Entite : null;
        var currentGroupe = rowData ? rowData.Groupe : null;
        var groupeAttrs = getAttrsByGroupeAndEntite(sender, currentGroupe, currentEntite);
        var filtered = options.value
            ? groupeAttrs.filter(function(a) { return a !== options.value; })
            : groupeAttrs;
        var attr2Q = getCellQuestion(row, q8_3, "Attribut2");
        if (attr2Q) {
            attr2Q.choices = filtered;
            if (attr2Q.value === options.value) {
                if (attr2Q.clearValue) attr2Q.clearValue(); else attr2Q.value = undefined;
            }
        }
    }
});

// Variables booléennes par type de donnée — utilisées dans les visibleIf des sections 9 et 10

// Mise à jour de tous les dropdowns d'attributs pour les sections 7 à 12
function updateAllAttributeDropdowns(survey) {
    var allAttrs = getAttrsByType(survey, null);

    // Section 7 – seules les entités sont mises à jour ici; les attributs se filtrent par entité via onMatrixCellValueChanged
    updateEntiteDropdowns(survey);

    // Section 8
    updateColumnChoices(survey, "question1g8", "Attribut", allAttrs);
    updateColumnChoices(survey, "question2g8", "Attribut", allAttrs);
    // Attribut1 et Attribut2 de question3g8 se filtrent par Groupe via onMatrixCellValueChanged

    // Groupes pour 8.3 — colonne-niveau uniquement si aucune entité sélectionnée
    var q5 = survey.getQuestionByName("question1g5");
    if (q5) {
        var rows = q5.value || [];
        var rowsWithGroupe = rows.filter(function(r) { return r.Grupo; });
        var groupes = rowsWithGroupe.map(function(r) { return r.Grupo; });
        var uniqueGroupes = groupes.filter(function(v, i) { return groupes.indexOf(v) === i; });
        updateColumnChoices(survey, "question3g8", "Groupe", uniqueGroupes);
        survey.setVariable("hasGroupe", uniqueGroupes.length > 0);
        var entitesAvecGroupe = rowsWithGroupe.map(function(r) { return r.Entites; }).filter(function(v) { return v; });
        var uniqueEntitesAvecGroupe = entitesAvecGroupe.filter(function(v, i) { return entitesAvecGroupe.indexOf(v) === i; });
        updateColumnChoices(survey, "question3g8", "Entite", uniqueEntitesAvecGroupe);
    } else {
        survey.setVariable("hasGroupe", false);
    }
    // Attribut1/Attribut2 de question3g8 se filtrent par Entite+Groupe via onMatrixCellValueChanged

    // Section 9 - filtrado por tipo de dato
    updateColumnChoices(survey, "question1g9", "Attribut", getAttrsByType(survey, "Date"));
    updateColumnChoices(survey, "question2g9", "Attribut", getAttrsByType(survey, "Identifiant interne"));
    updateColumnChoices(survey, "question3g9", "Attribut", getAttrsByType(survey, "Identifiant ou lien externe"));
    var ressourceAttrs = getAttrsByType(survey, "Lien vers une ressource numérique");
    updateColumnChoices(survey, "question4g9",  "Attribut", ressourceAttrs);
    updateColumnChoices(survey, "question3g10", "Attribut", ressourceAttrs);
    updateColumnChoices(survey, "question6g9", "Attribut1", getAttrsByType(survey, "Lien vers une autre entité/table"));
    updateColumnChoices(survey, "question7g9", "Attribut", getAttrsByType(survey, "Texte libre"));
    updateColumnChoices(survey, "question8g9", "Attribut", getAttrsByType(survey, "Vocabulaire contrôlé"));

    // Section 10
    updateColumnChoices(survey, "question1g10b", "Attribut", allAttrs);
    var identifiantAttrs = getAttrsByType(survey, "Identifiant interne").concat(
        getAttrsByType(survey, "Identifiant ou lien externe")
    ).filter(function(v, i, a) { return a.indexOf(v) === i; });
    updateColumnChoices(survey, "question2g10", "Attribut", identifiantAttrs);

    // Section 11
    updateColumnChoices(survey, "question1g11b", "Attribut", allAttrs);

    // Section 12 sensible
    updateColumnChoices(survey, "question1g12s", "Attribut", allAttrs);
    updateColumnChoices(survey, "question2g12s", "Attribut", allAttrs);

    // Section 13
    updateColumnChoices(survey, "question1g12", "Attribut", allAttrs);
}

// CSV helpers
// ─────────────────────────────────────────────────────────────────────────────
function csvEsc(v) {
    if (v == null) return '';
    var s = String(v);
    return (s.indexOf(';') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1)
        ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvQval(surveyInstance, name) {
    var q = surveyInstance.getQuestionByName(name);
    return (q && q.value) ? q.value : [];
}
function csvDownload(filename, rows) {
    var BOM = '﻿';
    var csv = BOM + rows.map(function(r) { return r.map(csvEsc).join(';'); }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

// CSV 1 — Informations générales (une seule ligne)
// ─────────────────────────────────────────────────────────────────────────────
function csvGeneral(s) {
    var d = s.data || {};
    var headers = ['1.1.- Institution', '1.2.- Email', '1.3.- Personne',
                   '2.1.- Domaine', '2.2.- Description_Domain'];
    var domaines = d.question1g2;
    var domaineStr = Array.isArray(domaines) ? domaines.join(' | ') : (domaines || '');
    var row = [d.question1g1 || '', d.question2g1 || '', d.question3g1 || '',
               domaineStr, d.question2g2 || ''];
    csvDownload('CSV_informations_generales.csv', [headers, row]);
}
window.downloadCSVGeneral = function() { csvGeneral(survey); };

// ─────────────────────────────────────────────────────────────────────────────
// CSV 2 — Entités (une ligne par entité)
// ─────────────────────────────────────────────────────────────────────────────
function csvEntites(s) {
    // Doublons par entité (question1g6)
    var doublons = {};
    csvQval(s, 'question1g6').forEach(function(r) {
        if (r.entite) doublons[r.entite] = { volume: r.volume || '', commentaires: r.commentaires || '' };
    });

    var headers = ['4.1.- Entité', '4.1.- Volume', '4.1.- Modèle', '4.1.- Système_gestion',
                   '6.1.- Volume_doublons', '6.1.- Commentaires_doublons'];
    var rows = [headers];
    csvQval(s, 'question1g4').forEach(function(r) {
        if (!r.entite) return;
        var d = doublons[r.entite] || { volume: '', commentaires: '' };
        rows.push([r.entite, r.volume || '', r.modele || '', r.systeme || '',
                   d.volume, d.commentaires]);
    });
    csvDownload('CSV_entites.csv', rows);
}
window.downloadCSVEntites = function() { csvEntites(survey); };

// ─────────────────────────────────────────────────────────────────────────────
// CSV 3 — Attributs (une ligne par attribut, colonnes multi-valeur numérotées)
// ─────────────────────────────────────────────────────────────────────────────
function csvAttributs(s) {

    // Lookup: attr → [rows] for multi-value questions
    function buildMap(qName, keyCol) {
        var map = {};
        csvQval(s, qName).forEach(function(r) {
            var k = r[keyCol]; if (!k) return;
            if (!map[k]) map[k] = [];
            map[k].push(r);
        });
        return map;
    }
    function maxCount(map) {
        var max = 0;
        Object.keys(map).forEach(function(k) { if (map[k].length > max) max = map[k].length; });
        return Math.max(max, 1);
    }

    // Entity model lookup (4.1)
    var entityModels = {};
    csvQval(s, 'question1g4').forEach(function(r) {
        if (r.entite) entityModels[r.entite] = r.modele || '';
    });

    // Multi-value maps
    var m7  = buildMap('question1g7',  'Attribut');
    var m81 = buildMap('question1g8',  'Attribut');
    var m82 = buildMap('question2g8',  'Attribut');
    var m91 = buildMap('question1g9',  'Attribut');
    var m92 = buildMap('question2g9',  'Attribut');
    var m93 = buildMap('question3g9',  'Attribut');
    var m94  = buildMap('question4g9',  'Attribut');
    var m103 = buildMap('question3g10', 'Attribut');
    var m98 = buildMap('question8g9',  'Attribut');

    // Multi-value map — 9.5 lien entité (question6g9)
    var m96 = buildMap('question6g9',  'Attribut1');

    // Single-value maps
    var m97 = buildMap('question7g9',  'Attribut');  // single row per attr
    var m10b = buildMap('question1g10b', 'Attribut');
    var m102= buildMap('question2g10', 'Attribut');
    var m11b  = buildMap('question1g11b', 'Attribut');
    var m12s1 = buildMap('question1g12s', 'Attribut');
    var m12s2 = buildMap('question2g12s', 'Attribut');
    var m12   = buildMap('question1g12',  'Attribut');

    var N7  = maxCount(m7);
    var N81 = maxCount(m81);
    var N82 = maxCount(m82);
    var N91 = maxCount(m91);
    var N92 = maxCount(m92);
    var N93 = maxCount(m93);
    var N94 = maxCount(m94);
    var N95 = maxCount(m96);
    var N98 = maxCount(m98);

    // Helper: generate numbered header suffix
    function sfx(i) { return i === 0 ? '' : String(i + 1); }

    // Build headers
    var headers = [
        '4.1.- Entité_Modèle',
        '5.1.- Attribut_Nom', '5.1.- Attribut_Nom_interne',
        '5.1.- Attribut_ObliOpti', '5.1.- Attribut_Type',
        '5.1.- Attribut_Groupe', '5.1.- Attribut_Langue',
        '5.1.- Attribut_Volume', '5.1.- Attribut_Description'
    ];
    for (var i = 0; i < N7;  i++) headers.push(
        '7.1.- Incertitud_TypeExpression' + sfx(i), '7.1.- Incertitud_Expression' + sfx(i),
        '7.1.- Incertitud_Volume' + sfx(i),    '7.1.- Incertitud_Exemple' + sfx(i));
    for (var i = 0; i < N81; i++) headers.push(
        '8.1.- Ambiguïté_cardinalité_RelationType' + sfx(i),
        '8.1.- Ambiguïté_cardinalité_Volume' + sfx(i));
    for (var i = 0; i < N82; i++) headers.push(
        '8.2.- Ambiguïté_valeurs_RelationType' + sfx(i),
        '8.2.- Ambiguïté_valeurs_Volume' + sfx(i));
    for (var i = 0; i < N91; i++) headers.push(
        '9.1.- Normalisation_Dates_Formats' + sfx(i),
        '9.1.- Normalisation_Dates_Volume'  + sfx(i));
    for (var i = 0; i < N92; i++) headers.push(
        '9.2.- Normalisation_Identifiant_Structure' + sfx(i),
        '9.2.- Normalisation_Identifiant_Unicité'   + sfx(i),
        '9.2.- Normalisation_Identifiant_Clé'       + sfx(i),
        '9.2.- Normalisation_Identifiant_Volume'    + sfx(i));
    for (var i = 0; i < N93; i++) headers.push(
        '9.3.- Normalisation_LienExterne_Type'   + sfx(i),
        '9.3.- Normalisation_LienExterne_Volume' + sfx(i));
    for (var i = 0; i < N94; i++) headers.push(
        '9.4.- Normalisation_LienRessource_TypeLien' + sfx(i),
        '9.4.- Normalisation_LienRessource_Ressource'+ sfx(i),
        '9.4.- Normalisation_LienRessource_Volume'   + sfx(i));
    for (var i = 0; i < N95; i++) headers.push(
        '9.5.- Normalisation_LienEntite_Entités' + sfx(i),
        '9.5.- Normalisation_LienEntite_Volume'  + sfx(i));
    headers.push(
        '9.6.- Normalisation_TextLibre_NFacettes');
    for (var i = 0; i < N98; i++) headers.push(
        '9.7.- Normalisation_Vocabulaire_Type'          + sfx(i),
        '9.7.- Normalisation_Vocabulaire_Volume'         + sfx(i),
        '9.7.- Normalisation_Vocabulaire_NValeurs'       + sfx(i),
        '9.7.- Normalisation_Vocabulaire_DocumentInterne'+ sfx(i));
    headers.push(
        '10.1.- Cycle_Périodicité_globale',
        '10.1b.- Cycle_Périodicité_Périodicité', '10.1b.- Cycle_Commentaires',
        '10.2.- Cycle_Lien_Durabilité', '10.2.- Cycle_Lien_Commentaires',
        '10.3.- Accessibilité_Ressource', '10.3.- Accessibilité_Commentaires',
        '11.1.- Licence_globale',
        '11.1b.- Restriction_Type', '11.1b.- Restriction_Commentaires',
        '12.1.- DonnéesPerso_Type', '12.1.- DonnéesPerso_Solution', '12.1.- DonnéesPerso_Commentaires',
        '12.2.- Cultsensibles_Type', '12.2.- Cultsensibles_Solution', '12.2.- Cultsensibles_Commentaires',
        '13.1.- Publiabilité_Publicable', '13.1.- Publiabilité_Priorité',
        '13.1.- Publiabilité_Commentaires');

    // Helper: fill N blocks of multi-value data
    function fillMulti(rows, n, extractor) {
        for (var i = 0; i < n; i++) {
            extractor(rows[i] || null).forEach(function(v) { row.push(v); });
        }
    }

    var csvRows = [headers];
    var row; // hoisted reference for fillMulti

    csvQval(s, 'question1g5').forEach(function(r) {
        if (!r.Attributs) return;
        var attr   = r.Attributs;
        var entity = r.Entites || '';
        var model  = entityModels[entity] || '';

        row = [
            entity + (model ? ' (' + model + ')' : ''),
            attr, r.NomInterne || '', r.Obligatoire || '', r.TypeDonnee || '',
            r.Grupo || '', r.Langue || '', r.Volume || '', r.Description || ''
        ];

        // 7.1 incertitudes
        fillMulti(m7[attr]  || [], N7,  function(x) { return [x ? x.IncertitudeStructure||'' : '', x ? x.IncertitudeExpression||'' : '', x ? x.Volume||'' : '', x ? x.Exemple||'' : '']; });
        // 8.1 ambiguïtés cardinalité
        fillMulti(m81[attr] || [], N81, function(x) {
            var rt = x ? (Array.isArray(x.RelationType) ? x.RelationType.join(' | ') : (x.RelationType||'')) : '';
            return [rt, x ? x.Volume||'' : ''];
        });
        // 8.2 ambiguïtés valeurs
        fillMulti(m82[attr] || [], N82, function(x) {
            var rel = x ? (Array.isArray(x.Relation) ? x.Relation.join(' | ') : (x.Relation||'')) : '';
            return [rel, x ? x.Volume||'' : ''];
        });
        // 9.1 dates
        fillMulti(m91[attr] || [], N91, function(x) { return [x ? x.FormatDate||'' : '', x ? x.Volume||'' : '']; });
        // 9.2 identifiant interne
        fillMulti(m92[attr] || [], N92, function(x) {
            var sc = x ? (Array.isArray(x.StructureComposition) ? x.StructureComposition.join(' | ') : (x.StructureComposition||'')) : '';
            return [sc, x ? x.Unicite||'' : '', x ? x.CleComposite||'' : '', x ? x.Volume||'' : ''];
        });
        // 9.3 lien externe
        fillMulti(m93[attr] || [], N93, function(x) { return [x ? x.TypeIdentifiant||'' : '', x ? x.Volume||'' : '']; });
        // 9.4 ressource numérique (interne + externe fusionnés)
        fillMulti(m94[attr] || [], N94, function(x) { return [x ? x.TypeLien||'' : '', x ? x.Ressource||'' : '', x ? x.Volume||'' : '']; });
        // 9.5 lien entité
        fillMulti(m96[attr] || [], N95, function(x) { return [x ? x.Entites||'' : '', x ? x.Volume||'' : '']; });
        // 9.6 texte libre (single)
        var r97 = (m97[attr] || [])[0] || {};
        row.push(r97.NbFacettes||'');
        // 9.7 vocabulaire
        fillMulti(m98[attr] || [], N98, function(x) {
            var doc = x && x.DocumentInterne;
            var docStr = Array.isArray(doc) && doc.length > 0 ? doc.map(function(f){ return f.name||'fichier'; }).join(', ') : (doc && doc.name ? doc.name : '');
            return [x ? x.TypeVocabulaire||'' : '', x ? x.Volume||'' : '', x ? x.NbValeurs||'' : '', docStr];
        });
        // 10.1, 10.2, 10.3, 11, 12, 13
        var r10b  = (m10b[attr]  || [])[0] || {};
        var r102  = (m102[attr]  || [])[0] || {};
        var r103  = (m103[attr]  || [])[0] || {};
        var r11b  = (m11b[attr]  || [])[0] || {};
        var r12s1 = (m12s1[attr] || [])[0] || {};
        var r12s2 = (m12s2[attr] || [])[0] || {};
        var r12   = (m12[attr]   || [])[0] || {};
        var periodiciteGlobale = s.getQuestionByName('question1g10a') ? (s.getQuestionByName('question1g10a').value || '') : '';
        var licenceGlobale = s.getQuestionByName('question1g11a') ? (s.getQuestionByName('question1g11a').value || '') : '';
        row.push(periodiciteGlobale,
                 r10b.Periodicite||'', r10b.Commentaires||'',
                 r102.Durabilite||'', r102.Commentaires||'',
                 r103.Accessibilite||'', r103.Commentaires||'',
                 licenceGlobale,
                 r11b.Restriction||'', r11b.Commentaires||'',
                 r12s1.TypeDonneePerso||'', r12s1.Solution||'', r12s1.Commentaires||'',
                 r12s2.TypeSensibilite||'', r12s2.Solution||'', r12s2.Commentaires||'',
                 r12.Publiable||'', r12.Priorite||'', r12.Commentaires||'');

        csvRows.push(row);
    });

    csvDownload('CSV_attributs.csv', csvRows);
}
window.downloadCSVAttributs = function() { csvAttributs(survey); };

// ─────────────────────────────────────────────────────────────────────────────
// Visualization
// ─────────────────────────────────────────────────────────────────────────────
function renderViz(surveyInstance) {
    var container = document.getElementById('survey-viz');
    if (!container) return;
    if (typeof d3 === 'undefined') {
        container.innerHTML = '<p style="color:#c00;padding:20px;">D3.js non disponible — vérifiez votre connexion internet.</p>';
        return;
    }

    // ── Collect data ──────────────────────────────────────────────────────────
    function qval(name) {
        var q = surveyInstance.getQuestionByName(name);
        return (q && q.value) ? q.value : [];
    }

    var entityMeta = {};
    qval('question1g4').forEach(function(r) {
        if (r.entite) entityMeta[r.entite] = { volume: parseInt(r.Volume) || 0, doublons: 0 };
    });
    qval('question1g6').forEach(function(r) {
        if (r.entite && entityMeta[r.entite]) entityMeta[r.entite].doublons = parseInt(r.volume) || 0;
    });

    var attrMeta = {};
    qval('question1g5').forEach(function(r) {
        if (r.Attributs) attrMeta[r.Attributs] = {
            entity: r.Entites || '', type: r.TypeDonnee || '',
            volume: parseInt(r.Volume) || 0,
            publiable: null, priorite: null,
            uncertain: false, ambiguous: false,
            pctNC: null
        };
    });

    qval('question1g12').forEach(function(r) {
        if (r.Attribut && attrMeta[r.Attribut]) {
            attrMeta[r.Attribut].publiable = r.Publiable || null;
            attrMeta[r.Attribut].priorite  = r.Priorite  || null;
        }
    });

    qval('question1g7').forEach(function(r) {
        if (r.Attribut && attrMeta[r.Attribut]) attrMeta[r.Attribut].uncertain = true;
    });

    ['question1g8', 'question2g8'].forEach(function(n) {
        qval(n).forEach(function(r) {
            var k = r.Attribut || r.Attribut1;
            if (k && attrMeta[k]) attrMeta[k].ambiguous = true;
        });
    });

    // ── % NC par dimension (cota inferior : max sans double comptage) ─────────
    var ncDim = {};
    function ensureNC(attr) {
        if (!ncDim[attr]) ncDim[attr] = {
            incertitude: 0, ambiguiteCardinalite: 0, ambiguiteValeurs: 0,
            ambiguiteGroupe: 0, dates: 0, identifiantInterne: 0,
            identifiantExterne: 0, ressource: 0, lienEntite: 0, vocabulaire: 0
        };
    }

    // 7.1 — Texte libre comme expression d'incertitude → volume = NC
    qval('question1g7').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        var expr = r.IncertitudeExpression;
        var hasTexteLibre = Array.isArray(expr) ? expr.indexOf('Texte libre') !== -1 : expr === 'Texte libre';
        if (hasTexteLibre) { ensureNC(attr); ncDim[attr].incertitude += parseInt(r.Volume) || 0; }
    });

    // 8.1 — NC = total - volume (volume = enregistrements avec relation correcte)
    var sum81 = {};
    qval('question1g8').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        sum81[attr] = (sum81[attr] || 0) + (parseInt(r.Volume) || 0);
    });
    Object.keys(sum81).forEach(function(attr) {
        ensureNC(attr);
        ncDim[attr].ambiguiteCardinalite = Math.max(0, (attrMeta[attr].volume || 0) - sum81[attr]);
    });

    // 8.2 — NC = volume directement
    qval('question2g8').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        ensureNC(attr); ncDim[attr].ambiguiteValeurs += parseInt(r.Volume) || 0;
    });

    // 8.3 — NC = total - volume pour Attribut1 et Attribut2
    var sum83a = {}, sum83b = {};
    qval('question3g8').forEach(function(r) {
        var vol = parseInt(r.Volume) || 0;
        if (r.Attribut1 && attrMeta[r.Attribut1]) sum83a[r.Attribut1] = (sum83a[r.Attribut1] || 0) + vol;
        if (r.Attribut2 && attrMeta[r.Attribut2]) sum83b[r.Attribut2] = (sum83b[r.Attribut2] || 0) + vol;
    });
    [sum83a, sum83b].forEach(function(sums) {
        Object.keys(sums).forEach(function(attr) {
            ensureNC(attr);
            ncDim[attr].ambiguiteGroupe = Math.max(ncDim[attr].ambiguiteGroupe,
                Math.max(0, (attrMeta[attr].volume || 0) - sums[attr]));
        });
    });

    // 9.1 — NC = total - volume
    var sum91 = {};
    qval('question1g9').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        sum91[attr] = (sum91[attr] || 0) + (parseInt(r.Volume) || 0);
    });
    Object.keys(sum91).forEach(function(attr) {
        ensureNC(attr);
        ncDim[attr].dates = Math.max(0, (attrMeta[attr].volume || 0) - sum91[attr]);
    });

    // 9.2 — Si Unicité = "Non" → NC = Volume_9.2
    qval('question2g9').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        if (r.Unicite === 'Non') { ensureNC(attr); ncDim[attr].identifiantInterne += parseInt(r.Volume) || 0; }
    });

    // 9.3 — 1 ligne = curé ; 2+ lignes même attribut → somme des volumes = NC
    var rows93 = {};
    qval('question3g9').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        if (!rows93[attr]) rows93[attr] = [];
        rows93[attr].push(parseInt(r.Volume) || 0);
    });
    Object.keys(rows93).forEach(function(attr) {
        if (rows93[attr].length > 1) {
            ensureNC(attr);
            ncDim[attr].identifiantExterne = rows93[attr].reduce(function(s, v) { return s + v; }, 0);
        }
    });

    // 9.4 — Idem 9.3
    var rows94 = {};
    qval('question4g9').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        if (!rows94[attr]) rows94[attr] = [];
        rows94[attr].push(parseInt(r.Volume) || 0);
    });
    Object.keys(rows94).forEach(function(attr) {
        if (rows94[attr].length > 1) {
            ensureNC(attr);
            ncDim[attr].ressource = rows94[attr].reduce(function(s, v) { return s + v; }, 0);
        }
    });

    // 9.5 (question6g9) — NC = total - volume
    var sum95 = {};
    qval('question6g9').forEach(function(r) {
        var attr = r.Attribut1; if (!attr || !attrMeta[attr]) return;
        sum95[attr] = (sum95[attr] || 0) + (parseInt(r.Volume) || 0);
    });
    Object.keys(sum95).forEach(function(attr) {
        ensureNC(attr);
        ncDim[attr].lienEntite = Math.max(0, (attrMeta[attr].volume || 0) - sum95[attr]);
    });

    // 9.6 (question7g9) — pas de NC

    // 9.7 (question8g9) — NC = total - volume
    var sum97 = {};
    qval('question8g9').forEach(function(r) {
        var attr = r.Attribut; if (!attr || !attrMeta[attr]) return;
        sum97[attr] = (sum97[attr] || 0) + (parseInt(r.Volume) || 0);
    });
    Object.keys(sum97).forEach(function(attr) {
        ensureNC(attr);
        ncDim[attr].vocabulaire = Math.max(0, (attrMeta[attr].volume || 0) - sum97[attr]);
    });

    // pctNC global = max NC par dimension / total (cota inferior, sans double comptage)
    Object.keys(attrMeta).forEach(function(name) {
        var a = attrMeta[name];
        if (a.volume <= 0 || !ncDim[name]) return;
        var dims = ncDim[name];
        var maxNC = Math.max(
            dims.incertitude, dims.ambiguiteCardinalite, dims.ambiguiteValeurs,
            dims.ambiguiteGroupe, dims.dates, dims.identifiantInterne,
            dims.identifiantExterne, dims.ressource, dims.lienEntite, dims.vocabulaire
        );
        a.pctNC = Math.round(Math.min(maxNC, a.volume) / a.volume * 100);
        a.ncDimensions = dims;
    });

    var entityLinks = [];
    qval('question6g9').forEach(function(r) {
        if (r.Entite && r.Entites && r.Entite !== r.Entites)
            entityLinks.push({ source: r.Entite, target: r.Entites, label: r.Attribut1 || '' });
    });

    var entityNames = Object.keys(entityMeta);
    var allAttrs = Object.keys(attrMeta).map(function(n) { return Object.assign({ id: n }, attrMeta[n]); });

    if (entityNames.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#888;padding:40px;">Aucune entité trouvée. Veuillez compléter la question 4.1.</p>';
        return;
    }


    // ── Colors ────────────────────────────────────────────────────────────────
    var PUB_COLORS = {
        'Oui': '#27ae60',
        'Oui ultérieurement (raison légale)': '#e67e22',
        'Oui ultérieurement (raison curatorielle)': '#f1c40f',
        'Non': '#e74c3c'
    };
    function pubColor(p) { return PUB_COLORS[p] || '#95a5a6'; }
    function ncColor(pct) {
        if (pct === null) return '#aaa';
        if (pct <= 10) return '#27ae60';
        if (pct <= 40) return '#f39c12';
        return '#e74c3c';
    }

    // ── Node size scale — proportionnel au volume (aire ∝ volume → r ∝ √volume) ─
    var allEntityVols = entityNames.map(function(n) { return entityMeta[n].volume || 0; });
    var allAttrVols   = allAttrs.map(function(a) { return a.volume || 0; });
    var maxEVol = Math.max.apply(null, allEntityVols.concat([1]));
    var maxAVol = Math.max.apply(null, allAttrVols.concat([1]));

    function entityRadius(v) {
        // r_min=20 (si volume=0), r_max=65 (si volume=max) ; aire ∝ volume
        return Math.round(20 + 45 * Math.sqrt(Math.max(v, 0) / maxEVol));
    }
    function attrRadius(v) {
        // r_min=8, r_max=30 ; aire ∝ volume
        return Math.round(8 + 22 * Math.sqrt(Math.max(v, 0) / maxAVol));
    }

    // Pre-compute radii
    entityNames.forEach(function(n) { entityMeta[n].r = entityRadius(entityMeta[n].volume); });
    allAttrs.forEach(function(a) { a.r = attrRadius(a.volume); });

    var maxER = Math.max.apply(null, entityNames.map(function(n) { return entityMeta[n].r; }));
    var maxAR = Math.max.apply(null, allAttrs.map(function(a) { return a.r; }).concat([11]));

    // ── Layout ────────────────────────────────────────────────────────────────
    var W   = Math.max(container.offsetWidth || 900, 700);
    var EY  = maxER + 20;
    var GAP = Math.max(maxER * 2 + 100, (W - 80) / entityNames.length);

    var entityPos = {};
    entityNames.forEach(function(n, i) {
        entityPos[n] = { x: 40 + GAP * i + GAP / 2, y: EY };
    });

    var attrsByEntity = {};
    entityNames.forEach(function(n) { attrsByEntity[n] = []; });
    allAttrs.forEach(function(a) {
        if (a.entity && attrsByEntity[a.entity]) attrsByEntity[a.entity].push(a);
    });

    var CW   = maxAR * 2 + 18;   // cell width per attr (accounts for label + % below)
    var CH   = maxAR * 2 + 38;   // cell height (circle + name + pctNC label)
    var COLS = 5;
    var AY0  = EY + maxER + 70;
    var maxRows = 0;

    entityNames.forEach(function(n) {
        var attrs = attrsByEntity[n];
        var rows  = Math.ceil(attrs.length / COLS);
        if (rows > maxRows) maxRows = rows;
        var gridW = Math.min(attrs.length, COLS) * CW;
        var sx    = entityPos[n].x - gridW / 2 + CW / 2;
        attrs.forEach(function(a, i) {
            a.x = sx + (i % COLS) * CW;
            a.y = AY0 + Math.floor(i / COLS) * CH + a.r;
        });
    });

    var LEGEND_H = 200;
    var H = AY0 + maxRows * CH + LEGEND_H + 20;

    // ── SVG ───────────────────────────────────────────────────────────────────
    d3.select('#survey-viz').selectAll('*').remove();
    d3.select('#viz-tooltip').remove();

    var svg = d3.select('#survey-viz').append('svg')
        .attr('width', W).attr('height', H)
        .style('font-family', 'Arial, sans-serif');

    // Arrowhead (refX scales with radius at render time, so use a fixed offset)
    svg.append('defs').append('marker')
        .attr('id', 'viz-arrow').attr('viewBox', '0 -5 10 10')
        .attr('refX', maxER + 8).attr('refY', 0)
        .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
        .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#3498db');

    // Entity→Attribute lines
    entityNames.forEach(function(n) {
        var ep = entityPos[n], er = entityMeta[n].r;
        attrsByEntity[n].forEach(function(a) {
            svg.append('line')
                .attr('x1', ep.x).attr('y1', ep.y + er)
                .attr('x2', a.x).attr('y2', a.y - a.r - 2)
                .attr('stroke', '#dde').attr('stroke-width', 1);
        });
    });

    // Entity↔Entity relationship curves
    entityLinks.forEach(function(lk) {
        var s = entityPos[lk.source], t = entityPos[lk.target];
        if (!s || !t) return;
        var mx = (s.x + t.x) / 2, my = Math.min(s.y, t.y) - 65;
        svg.append('path')
            .attr('d', 'M' + s.x + ',' + s.y + ' Q' + mx + ',' + my + ' ' + t.x + ',' + t.y)
            .attr('stroke', '#3498db').attr('stroke-width', 2).attr('fill', 'none')
            .attr('stroke-dasharray', '6,3').attr('marker-end', 'url(#viz-arrow)');
        if (lk.label) svg.append('text')
            .attr('x', mx).attr('y', my - 6)
            .attr('text-anchor', 'middle').attr('font-size', 9).attr('fill', '#3498db')
            .text(lk.label.length > 15 ? lk.label.slice(0, 14) + '…' : lk.label);
    });

    // ── Entity nodes ──────────────────────────────────────────────────────────
    var eG = svg.selectAll('.e-node').data(entityNames).enter()
        .append('g').attr('class', 'e-node')
        .attr('transform', function(n) { var p = entityPos[n]; return 'translate(' + p.x + ',' + p.y + ')'; });

    eG.append('circle')
        .attr('r', function(n) { return entityMeta[n].r; })
        .attr('fill', '#2c3e50').attr('stroke', '#1a252f').attr('stroke-width', 2);

    // Entity name (inside circle, 2 lines if needed)
    eG.each(function(n) {
        var er = entityMeta[n].r;
        var g  = d3.select(this);
        var words = n.split(/[\s\-_]+/);
        var mid = Math.ceil(words.length / 2);
        var line1 = words.slice(0, mid).join(' ');
        var line2 = words.slice(mid).join(' ');
        var fs = er >= 50 ? 12 : er >= 40 ? 11 : 10;
        var maxLen = Math.floor(er * 1.6 / (fs * 0.6));
        function trunc(s) { return s.length > maxLen ? s.slice(0, maxLen - 1) + '…' : s; }
        if (line2) {
            g.append('text').attr('text-anchor','middle').attr('dy', -5)
                .attr('fill','white').attr('font-size', fs).attr('font-weight','bold').text(trunc(line1));
            g.append('text').attr('text-anchor','middle').attr('dy', fs + 1)
                .attr('fill','white').attr('font-size', fs).attr('font-weight','bold').text(trunc(line2));
        } else {
            g.append('text').attr('text-anchor','middle').attr('dy', 4)
                .attr('fill','white').attr('font-size', fs).attr('font-weight','bold').text(trunc(n));
        }
    });

    // Below entity: volume
    eG.append('text').attr('text-anchor', 'middle')
        .attr('dy', function(n) { return entityMeta[n].r + 15; })
        .attr('fill', '#444').attr('font-size', 10)
        .text(function(n) {
            var v = entityMeta[n].volume;
            return v ? v.toLocaleString('fr-CH') + ' enreg.' : '';
        });

    // Below entity: doublons
    eG.append('text').attr('text-anchor', 'middle')
        .attr('dy', function(n) { return entityMeta[n].r + 28; })
        .attr('font-size', 10).attr('font-weight', 'bold')
        .attr('fill', '#e74c3c')
        .text(function(n) {
            var d = entityMeta[n].doublons;
            return d > 0 ? d.toLocaleString('fr-CH') + ' doublons' : '';
        });

    // ── Tooltip ───────────────────────────────────────────────────────────────
    var tip = d3.select('body').append('div').attr('id', 'viz-tooltip')
        .style('position', 'absolute').style('display', 'none')
        .style('background', 'rgba(20,20,20,.88)').style('color', '#fff')
        .style('padding', '8px 12px').style('border-radius', '5px')
        .style('font-size', '12px').style('line-height', '1.6')
        .style('pointer-events', 'none').style('max-width', '280px').style('z-index', '9999');

    // ── Attribute nodes ───────────────────────────────────────────────────────
    var aG = svg.selectAll('.a-node').data(allAttrs).enter()
        .append('g').attr('class', 'a-node')
        .attr('transform', function(d) { return 'translate(' + (d.x || 0) + ',' + (d.y || 0) + ')'; })
        .style('cursor', 'pointer')
        .on('mouseover', function(event, d) {
            var ncStr = d.pctNC !== null ? d.pctNC + '% NC' : 'non déterminé';
            var dimLabels = {
                incertitude: 'Incertitudes (7.1)', ambiguiteCardinalite: 'Ambig. cardinalité (8.1)',
                ambiguiteValeurs: 'Ambig. valeurs (8.2)', ambiguiteGroupe: 'Ambig. groupe (8.3)',
                dates: 'Dates (9.1)', identifiantInterne: 'Identifiant interne (9.2)',
                identifiantExterne: 'Identifiant externe (9.3)', ressource: 'Ressource num. (9.4)',
                lienEntite: 'Lien entité (9.5)', vocabulaire: 'Vocabulaire (9.7)'
            };
            var dimHtml = '';
            if (d.ncDimensions && d.volume > 0) {
                Object.keys(dimLabels).forEach(function(k) {
                    var v = d.ncDimensions[k];
                    if (v > 0) {
                        var pct = Math.round(Math.min(v, d.volume) / d.volume * 100);
                        dimHtml += '<br>&nbsp;&nbsp;<small>' + dimLabels[k] + ' : ' + pct + '%</small>';
                    }
                });
                if (dimHtml) dimHtml = '<br><small style="color:#aaa;">Détail par dimension :</small>' + dimHtml;
            }
            tip.style('display', 'block').html(
                '<strong>' + d.id + '</strong><br>' +
                (d.entity ? 'Entité : ' + d.entity + '<br>' : '') +
                (d.type   ? 'Type : '   + d.type   + '<br>' : '') +
                (d.volume ? 'Volume : ' + d.volume.toLocaleString('fr-CH') + '<br>' : '') +
                '% NC (cota inferior) : ' + ncStr + dimHtml + '<br>' +
                'Publiabilité : ' + (d.publiable || '<em>non renseignée</em>') +
                (d.priorite  ? '<br>Priorité : ' + d.priorite : '') +
                (d.uncertain ? '<br><span style="color:#ffd;">⚠ Incertitudes déclarées</span>' : '') +
                (d.ambiguous ? '<br><span style="color:#fca;">⚠ Ambiguïtés déclarées</span>' : '')
            );
        })
        .on('mousemove', function(event) {
            tip.style('left', (event.pageX + 14) + 'px').style('top', (event.pageY - 10) + 'px');
        })
        .on('mouseout', function() { tip.style('display', 'none'); });

    aG.append('circle')
        .attr('r', function(d) { return d.r; })
        .attr('fill', function(d) { return pubColor(d.publiable); })
        .attr('stroke', function(d) { return d.uncertain ? '#c0392b' : (d.ambiguous ? '#e67e22' : '#aaa'); })
        .attr('stroke-width', function(d) { return (d.uncertain || d.ambiguous) ? 2.5 : 1; })
        .attr('stroke-dasharray', function(d) { return (!d.uncertain && d.ambiguous) ? '3,2' : null; });

    // Alerte incertitude/ambiguïté au-dessus
    aG.filter(function(d) { return d.uncertain || d.ambiguous; })
        .append('text').attr('text-anchor', 'middle')
        .attr('dy', function(d) { return -d.r - 3; })
        .attr('font-size', 9).attr('fill', '#c0392b').text('▲');

    // Nom de l'attribut (sous le cercle)
    aG.append('text').attr('text-anchor', 'middle')
        .attr('dy', function(d) { return d.r + 11; })
        .attr('font-size', 8).attr('fill', '#333')
        .text(function(d) { return d.id.length > 9 ? d.id.slice(0, 8) + '…' : d.id; });

    // % NC (sous le nom, toujours visible)
    aG.append('text').attr('text-anchor', 'middle')
        .attr('dy', function(d) { return d.r + 22; })
        .attr('font-size', 8).attr('font-weight', 'bold')
        .attr('fill', function(d) { return ncColor(d.pctNC); })
        .text(function(d) { return d.pctNC !== null ? d.pctNC + '% NC' : 'n.d.'; });

    // ── Legend ────────────────────────────────────────────────────────────────
    var LEG = [
        { color: '#27ae60', label: 'Publiable – Oui' },
        { color: '#e67e22', label: 'Publiable – Oui ultér. (légal)' },
        { color: '#f1c40f', label: 'Publiable – Oui ultér. (curation)' },
        { color: '#e74c3c', label: 'Non publiable' },
        { color: '#95a5a6', label: 'Publiabilité non renseignée' }
    ];
    var lx = 12, ly = H - LEGEND_H;
    var lg = svg.append('g').attr('transform', 'translate(' + lx + ',' + ly + ')');
    lg.append('rect').attr('x', -5).attr('y', -8)
        .attr('width', 310).attr('height', LEGEND_H - 10).attr('rx', 5)
        .attr('fill', 'rgba(255,255,255,0.93)').attr('stroke', '#ddd');
    LEG.forEach(function(item, i) {
        var g = lg.append('g').attr('transform', 'translate(4,' + (i * 20 + 4) + ')');
        g.append('circle').attr('r', 6).attr('cx', 6).attr('cy', 3).attr('fill', item.color);
        g.append('text').attr('x', 17).attr('y', 7).attr('font-size', 10).attr('fill', '#333').text(item.label);
    });
    var noteY = LEG.length * 20 + 10;
    [
        '% NC = cota inferior de données non curatées (max par dimension, sections 7-9)',
        'n.d. = non déterminé (données de normalisation absentes)',
        '▲ = incertitudes ou ambiguïtés déclarées',
        'Taille des nœuds proportionnelle au volume de données',
        'Chiffre rouge sous entité = nombre de doublons déclarés (6.1)'
    ].forEach(function(txt, i) {
        lg.append('text').attr('x', 4).attr('y', noteY + i * 14)
            .attr('font-size', 9).attr('fill', '#666').text(txt);
    });
}

// Actualización al navegar a cada página — garantiza que los dropdowns
// estén siempre al día con los datos de páginas anteriores
survey.onCurrentPageChanged.add(function(sender, options) {
    var page = options.newCurrentPage.name;
    // Masquer la nav standard sur la page d'accueil (bouton Commençons ! intégré au contenu)
    var container = document.getElementById('surveyContainer');
    if (container) {
        if (page === 'page_cover') {
            container.classList.add('hide-intro-nav');
        } else {
            container.classList.remove('hide-intro-nav');
        }
    }
    if (page === "page_questionsg6") {
        // 6.1 Doublons — entidades de 4.1
        updateEntiteDropdowns(sender);
    }
    if (page === "page_questionsg5") {
        // 5.1 Attributs — entidades de 4.1
        updateQuestion1g5(sender);
    }
    if (page === "page_questionsg7") {
        // 7.1 Incertitudes — entidades de 4.1 + atributos de 5.1
        updateEntiteDropdowns(sender);
        updateAllAttributeDropdowns(sender);
    }
    if (page === "page_questionsg8"  || page === "page_questionsg9"  ||
        page === "page_questionsg10" || page === "page_questionsg11" ||
        page === "page_questionsg_sensible" || page === "page_questionsg12") {
        // Secciones 8–12 — atributos de 5.1 + variables de tipo
        updateAllAttributeDropdowns(sender);
        updateTypeVariables(sender);
    }
    if (page === "page_fin") {
        // Dar tiempo al DOM para renderizar el contenedor HTML antes de dibujar
        setTimeout(function() { renderViz(sender); }, 150);
    }
});

// Créer le div du popup ⓘ
(function() {
    var popup = document.createElement('div');
    popup.id = 'col-info-popup';
    document.body.appendChild(popup);
    document.addEventListener('click', function(e) {
        if (!e.target.classList.contains('col-info-btn')) {
            document.getElementById('col-info-popup').classList.remove('visible');
        }
    });
})();

function showColInfoPopup(e, text) {
    e.stopPropagation();
    var popup = document.getElementById('col-info-popup');
    popup.innerHTML = text;
    var r = e.target.getBoundingClientRect();
    var W = 340;
    var left = Math.min(Math.max(r.left + r.width / 2 - W / 2, 5), window.innerWidth - W - 5);
    var top = r.bottom + 8;
    if (top + 160 > window.innerHeight) top = r.top - 168;
    popup.style.left = left + 'px';
    popup.style.top  = top  + 'px';
    popup.classList.add('visible');
}

// Injecter les boutons ⓘ dans les en-têtes de colonnes de toutes les questions visibles.
// Se déclenche via onCurrentPageChanged avec un délai pour laisser knockout terminer le rendu.
function injectColInfoIcons() {
    Object.keys(colInfoTexts).forEach(function(qName) {
        var info = colInfoTexts[qName];
        var q = survey.getQuestionByName(qName);
        if (!q || !q.columns) return;
        var qEl = document.querySelector('[data-name="' + qName + '"]');
        if (!qEl) return;
        var ths = qEl.querySelectorAll('table thead th');
        q.columns.forEach(function(col) {
            var text = info[col.name];
            if (!text) return;
            ths.forEach(function(th) {
                if (th.querySelector('.col-info-btn')) return; // déjà injecté
                var thText = th.textContent.replace(/\s+/g, ' ').trim();
                if (thText !== col.title) return;
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'col-info-btn';
                btn.textContent = 'i';
                btn.addEventListener('click', function(e) { showColInfoPopup(e, text); });
                th.appendChild(btn);
            });
        });
    });
}

survey.onCurrentPageChanged.add(function(sender, options) {
    setTimeout(injectColInfoIcons, 200);
});

// ── Sauvegarde localStorage ───────────────────────────────────────────────
var SAVE_KEY = 'surveyDiagnosticData';
var PAGE_KEY = 'surveyDiagnosticPage';

var INTRO_PAGES = ['page_cover'];

function updateSaveBtn(pageName) {
    var wrap = document.getElementById('save-wrap');
    if (wrap) wrap.style.display = INTRO_PAGES.indexOf(pageName) === -1 ? 'block' : 'none';
}

// Mostrar banner de recuperación si hay datos guardados
(function() {
    var saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
        var banner = document.getElementById('resume-banner');
        if (banner) banner.style.display = 'block';

        document.getElementById('resume-yes').addEventListener('click', function() {
            try {
                survey.data = JSON.parse(saved);
                var page = parseInt(localStorage.getItem(PAGE_KEY));
                if (!isNaN(page) && page < survey.pageCount) survey.currentPageNo = page;
            } catch(e) {}
            banner.style.display = 'none';
        });

        document.getElementById('resume-no').addEventListener('click', function() {
            localStorage.removeItem(SAVE_KEY);
            localStorage.removeItem(PAGE_KEY);
            banner.style.display = 'none';
        });
    }
})();

survey.onCurrentPageChanged.add(function(sender, options) {
    updateSaveBtn(options.newCurrentPage.name);
});

// Toujours remonter en haut de la page à chaque changement de page
survey.onCurrentPageChanged.add(function() {
    window.scrollTo(0, 0);
});

// Init visibility
updateSaveBtn(survey.currentPage.name);

function showToast() {
    var t = document.getElementById('save-toast');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
}

document.getElementById('save-btn').addEventListener('click', function() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(survey.data));
    localStorage.setItem(PAGE_KEY, survey.currentPageNo);
    showToast();
});
</script>
