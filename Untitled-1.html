<!DOCTYPE html>
<html>
<head>
  <title>SurveyJS Matrix Filtrado</title>
  <link href="https://unpkg.com/survey-jquery@1.9.100/survey.min.css" rel="stylesheet"/>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/survey-jquery@1.9.100/survey.jquery.min.js"></script>
</head>
<body>

<div id="surveyContainer"></div>

<script>
var surveyJSON = {
    "title": "Questionnaire de diagnostic des pratiques de gestion et de curation des données patrimoniales",
    "description": "Bienvenido, bienvenida\nEste cuestionario fue diseñado para comprender mejor las prácticas de gestión y curaduría de los datos patrimoniales en instituciones GLAM. El objetivo es recopilar información detallada sobre su sistema de gestión, modelos de metadatos usados, vocabularios utilizados, estado de curación, políticas de gobernanza, etc.\nLas respuestas a esta encuesta permitirán construir un panorama preciso del estado de los datos de su organización, contribuyendo así al desarrollo de una plataforma interconectada adaptada a las necesidades de cada institución.\nEl cuestionario es flexible y todas las respuestas se tratarán de manera confidencial.",
    "pages": [
        {
            "name": "page1",
            "elements": [
                // Question 1
                {
                    "type": "checkbox",
                    "name": "question1",
                    "title": "¿Cuál(es) es/son el/los dominio(s) temático(s) principal(es) de los datos que gestiona su institución? Marque todos los que correspondan:",
                    "choices": [
                        "Historia del arte",
                        "Arqueología",
                        "Etnografía / Antropología",
                        "Historia social y política",
                        "Ciencias naturales (botánica, zoología, geología, etc.)",
                        "Ciencias exactas o técnicas",
                        "Patrimonio industrial",
                        "Música / Artes escénicas",
                        "Literatura / Archivos literarios",
                        "Religión / Historia eclesiástica",
                        "Historia local / Patrimonio regional",
                        "Historia de la ciencia y tecnología",
                        "Patrimonio inmaterial",
                        "Otro"
                    ],
                    "hasOther": true, // Permite que el usuario escriba "Otro"
                    "colCount": 1 // Mostrar todas las opciones verticalmente
                },
                {
                    "type": "matrixdynamic",
                    "name": "question2",
                    "title": "Ingrese documentos",
                    "columns": [
                        {"name": "ID", "title": "ID", "cellType": "text"},
                        {"name": "Tipo", "title": "Tipo de dato", "cellType": "dropdown", "choices": ["Texto libre", "Vocabulario controlado", "Fecha"]}
                    ],
                    "rowCount": 1,
                    "addRowText": "Agregar documento"
                },
                {
                    "type": "matrixdynamic",
                    "name": "question3",
                    "title": "Detalles de documentos Fecha",
                    "columns": [
                        {"name": "ID_ref", "title": "ID Ref", "cellType": "dropdown", "choices": []},
                        {"name": "Detalle", "title": "Detalle", "cellType": "dropdown", "choices": ["1111", "22222", "5555"]}
                    ],
                    "rowCount": 1,
                    "visible": false
                }
            ]
        }
    ]
};

var survey = new Survey.Model(surveyJSON);

// Función para actualizar visibilidad y opciones de question3
function updateQuestion3(survey) {
    var question2 = survey.getQuestionByName("question2");
    var question3 = survey.getQuestionByName("question3");

    // Filtrar filas de question2 donde Tipo = "Fecha"
    var idsFecha = [];
    question2.value && question2.value.forEach(function(row){
        if(row.Tipo === "Fecha" && row.ID) {
            idsFecha.push(row.ID);
        }
    });

    // Actualizar visibilidad de question3
    question3.visible = idsFecha.length > 0;

    // Actualizar las opciones de la columna ID_ref
    var col = question3.columns[0]; // columna ID_ref
    col.choices = idsFecha;

    // Opcional: limpiar filas si ya no hay IDs válidos
    question3.data && question3.data.forEach(function(row){
        if(!idsFecha.includes(row.ID_ref)) row.ID_ref = "";
    });
}

// Llamar la función cada vez que cambia question2
survey.onValueChanged.add(function(sender, options) {
    if(options.name === "question2") {
        updateQuestion3(sender);
    }
});

// Renderizar encuesta
$("#surveyContainer").Survey({model: survey});
</script>

</body>
</html>
